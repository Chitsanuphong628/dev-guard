<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="520" viewBox="0 0 1500 520" role="img" aria-labelledby="title desc">
  <title id="title">Dev Guard development workflow</title>
  <desc id="desc">A risk-based software workflow from clarification through evidence-backed release decision.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity=".35"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#a5b4fc"/>
    </marker>
  </defs>
  <rect width="1500" height="520" rx="32" fill="url(#bg)"/>
  <circle cx="1390" cy="80" r="180" fill="#5b5fef" opacity=".12"/>
  <circle cx="120" cy="470" r="220" fill="#06b6d4" opacity=".08"/>
  <text x="72" y="72" fill="#c7d2fe" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="3">DEV-GUARD</text>
  <text x="72" y="116" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="800">Evidence-backed software delivery</text>
  <text x="72" y="150" fill="#a5b4fc" font-family="Segoe UI, Arial, sans-serif" font-size="17">Clarify risk · preserve contracts · prove behavior · report honestly</text>

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <g transform="translate(72,220)">
      <rect width="180" height="150" rx="22" fill="#312e81" stroke="#818cf8" stroke-width="2"/>
      <text x="90" y="45" fill="#c7d2fe" font-size="13" font-weight="700">01</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">CLARIFY</text>
      <text x="90" y="108" fill="#ddd6fe" font-size="14">Scope + criteria</text>
      <text x="90" y="130" fill="#ddd6fe" font-size="14">No risky guesses</text>
    </g>
    <g transform="translate(294,220)">
      <rect width="180" height="150" rx="22" fill="#164e63" stroke="#22d3ee" stroke-width="2"/>
      <text x="90" y="45" fill="#a5f3fc" font-size="13" font-weight="700">02</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">BASELINE</text>
      <text x="90" y="108" fill="#cffafe" font-size="14">Reproduce behavior</text>
      <text x="90" y="130" fill="#cffafe" font-size="14">Capture evidence</text>
    </g>
    <g transform="translate(516,220)">
      <rect width="180" height="150" rx="22" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="90" y="45" fill="#a7f3d0" font-size="13" font-weight="700">03</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">IMPACT</text>
      <text x="90" y="108" fill="#d1fae5" font-size="14">Consumers + risk</text>
      <text x="90" y="130" fill="#d1fae5" font-size="14">Choose gates</text>
    </g>
    <g transform="translate(738,220)">
      <rect width="180" height="150" rx="22" fill="#78350f" stroke="#fbbf24" stroke-width="2"/>
      <text x="90" y="45" fill="#fef3c7" font-size="13" font-weight="700">04</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">DESIGN</text>
      <text x="90" y="108" fill="#fef3c7" font-size="14">Small + maintainable</text>
      <text x="90" y="130" fill="#fef3c7" font-size="14">Rollback-aware</text>
    </g>
    <g transform="translate(960,220)">
      <rect width="180" height="150" rx="22" fill="#9a3412" stroke="#fb923c" stroke-width="2"/>
      <text x="90" y="45" fill="#ffedd5" font-size="13" font-weight="700">05</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">BUILD</text>
      <text x="90" y="108" fill="#ffedd5" font-size="14">Focused change</text>
      <text x="90" y="130" fill="#ffedd5" font-size="14">Test the mechanism</text>
    </g>
    <g transform="translate(1182,220)">
      <rect width="180" height="150" rx="22" fill="#831843" stroke="#f472b6" stroke-width="2"/>
      <text x="90" y="45" fill="#fbcfe8" font-size="13" font-weight="700">06</text>
      <text x="90" y="78" fill="#fff" font-size="21" font-weight="800">GATES</text>
      <text x="90" y="108" fill="#fce7f3" font-size="14">Evidence + regression</text>
      <text x="90" y="130" fill="#fce7f3" font-size="14">PASS / CONDITIONAL / FAIL</text>
    </g>
  </g>

  <g stroke="#a5b4fc" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M252 295 H286"/><path d="M474 295 H508"/><path d="M696 295 H730"/><path d="M918 295 H952"/><path d="M1140 295 H1174"/>
  </g>
  <text x="750" y="450" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15" text-anchor="middle">A blocked critical gate is not a pass.</text>
</svg>
